[project]
name = "shiryu"
version = "0.0.0"
description = "A SDK for programming languages."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "von Bergen, Federico", email = "federicovonbergen@gmail.com" },
]
maintainers = [
  { name = "von Bergen, Federico", email = "federicovonbergen@gmail.com" },
]
keywords = []
# python3.11 - https://docs.python.org/3/whatsnew/3.11.html
# - tomllib: Support for Parsing TOML in the Standard Library
# - Added StrEnum
# python3.12 - https://docs.python.org/3/whatsnew/3.12.html
# - Add pathlib.Path.walk()
# - New type parameter syntax and the type statement
requires-python = ">=3.12"
# NOTE: Keep these aligned with [project].requires-python; update if minimum Python changes.
classifiers = [
  # "Development Status :: 5 - Production/Stable",
  # "Framework :: AsyncIO",
  # "Framework :: Pytest",
  # "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "dagger-clients-core",
  "dagger-io",
  # >= 3.0.0: jinja is usable after version 3.0.0. Before that version throws: `ImportError: cannot import name 'soft_unicode' from 'markupsafe'`
  "jinja2 >= 3.0.0",
  "packaging",
]

[project.urls]
# "Homepage" = ""
Documentation = "https://fvonbergen.github.io/shiryu"
Repository = "https://github.com/fvonbergen/shiryu"
Issues = "https://github.com/fvonbergen/shiryu/issues"
Changelog = "https://github.com/fvonbergen/shiryu/blob/master/CHANGELOG.md"
# "Release Notes" = ""
# "Community" = ""

# Dependencies that will be installed for the specific module call.
[dependency-groups]
auditor = ["uv >= 0.11.0"]
builder = ["hatch >= 0.0.0"]
checker = [
  "pytest >= 7.4.0",
  "pytest-asyncio >= 0.24.0",
  # https://github.com/astral-sh/ty/releases/tag/0.0.100
  # >= 0.0.100: Distinguish attributes missing from some union members (#29944)
  # https://github.com/astral-sh/ty/releases/tag/0.0.102
  # >= 0.0.102: Split invalid-return-type into 3 focussed rules; rename empty-body and 
  #   unsound-return (#29947)
  "ty >= 0.0.102",
]
documenter = ["mkdocstrings-python >= 1.11.0", "zensical >= 0.0.66"]
jupyter = ["notebook >= 5.0.0", "python-lsp-server >= 0.1.1"]
linter = [
  "commit-check >= 2.0.0",
  # https://github.com/astral-sh/ruff/blob/main/CHANGELOG.md#0160
  # >= 0.16.0: New PLR0917 rule
  "ruff >= 0.16.0",
]
releaser = ["commitizen >= 4.3.0"]
tester = [
  "pytest >= 7.4.0",
  "pytest-asyncio >= 0.24.0",
  "pytest-cov >= 2.3.0",
  "pytest-xdist[psutil] >= 1.18.0",
]

[build-system]
# TODO: Pending analysis of this build system. Dagger uses it for its module.
# Build system changed in dagger v0.18.6 (https://github.com/dagger/dagger/releases/tag/sdk%2Fpython%2Fv0.18.16)
# requires = ["uv_build>=0.8.4,<0.12.0"]
# build-backend = "uv_build"
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["sdk", "clients/core"]

[tool.uv.sources]
dagger-io = { workspace = true }
dagger-clients-core = { workspace = true }
