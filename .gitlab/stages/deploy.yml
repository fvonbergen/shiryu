include:
  - local: ".gitlab/jobs/.builder_publish.yml"
  - local: ".gitlab/jobs/.documenter_document.yml"

deploy_builder_publish:
  extends: .builder_publish
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

deploy_documenter_document:
  extends: .documenter_document
  stage: deploy
  needs:
    - "deploy_builder_publish"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
