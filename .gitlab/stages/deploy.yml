include:
  - local: ".gitlab/jobs/.builder_deploy.yml"
  - local: ".gitlab/jobs/.documenter_document.yml"
deploy_builder_deploy:
  extends: .builder_deploy
  stage: deploy
  needs:
    - []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
deploy_documenter_document:
  extends: .documenter_document
  stage: deploy
  needs:
    - []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'