include:
  - local: ".gitlab/jobs/.builder_publish.yml"

publish builder publish:
  extends: .builder_publish
  stage: publish
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  environment:
    name: production
    deployment_tier: production
