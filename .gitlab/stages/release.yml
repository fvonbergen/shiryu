include:
  - local: ".gitlab/jobs/.releaser_release.yml"

release Releaser release:
  extends: .releaser_release
  stage: release
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG !~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_MESSAGE !~ /^bump: version/'
  when: manual
  environment:
    name: production
    deployment_tier: production
