include:
  - local: ".gitlab/jobs/.builder_publish.yml"
  - local: ".gitlab/jobs/.documenter_document.yml"
  - local: ".gitlab/jobs/.releaser_release.yml"

release_builder_publish:
  extends: .builder_publish
  stage: release
  needs:
    - ["release_releaser_release"]
release_documenter_document:
  extends: .documenter_document
  stage: release
  needs:
    - ["release_releaser_release"]
release_releaser_release:
  extends: .releaser_release
  stage: release
  needs:
    - []
