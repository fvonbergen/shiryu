include:
  - local: ".gitlab/jobs/.dagger.yml"

.auditor_audit:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk-release"
    SDK_LANGUAGE: "python"
    PLATFORM: "linux/amd64"
  script:
    - dagger --load-module=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} api call ${SDK_LANGUAGE} auditor audit --platform="${PLATFORM}"
