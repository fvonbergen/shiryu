include:
  - local: ".gitlab/jobs/.dagger.yml"

.releaser_release:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk-release"
    SDK_LANGUAGE: "python"
    GIT_STRATEGY: "fetch"
    GIT_DEPTH: "0"
    AUTH_TOKEN_REF: "env://AUTH_TOKEN"
    AUTH_USER_NAME: "x-access-token"
    GIT_USER_EMAIL: "ci@shiryu.dev"
    GIT_USER_NAME: "CI Release Bot"
    PLATFORM: "linux/amd64"
    BRANCH: "$CI_COMMIT_REF_NAME"
    VCS_USER_EMAIL: "ci@shiryu.dev"
    VCS_USER_NAME: "CI Release Bot"
  script:
    - dagger --mod=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} call ${SDK_LANGUAGE} releaser release --auth-token="${AUTH_TOKEN}" --platform="${PLATFORM}" --branch="${BRANCH}" --vcs-user-email="${VCS_USER_EMAIL}" --vcs-user-name="${VCS_USER_NAME}"
