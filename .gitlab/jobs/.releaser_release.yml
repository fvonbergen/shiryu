include:
  - local: ".gitlab/jobs/.dagger.yml"

.releaser_release:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk-release-add-deploy"
    SDK_LANGUAGE: "python"
    GIT_STRATEGY: "fetch"
    GIT_DEPTH: "0"
    AUTH_TOKEN_: "env:AUTH_TOKEN"
    AUTH_USER_NAME: "x-access-token"
    BRANCH: "$CI_COMMIT_REF_NAME"
    PLATFORM: "linux/amd64"
    VCS_USER_EMAIL: "ci@shiryu.dev"
    VCS_USER_NAME: "CI Release Bot"
  script:
    - dagger --load-module=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} call ${SDK_LANGUAGE} releaser release --auth-token="${AUTH_TOKEN_}" --auth-user-name="${AUTH_USER_NAME}" --branch="${BRANCH}" --platform="${PLATFORM}" --vcs-user-email="${VCS_USER_EMAIL}" --vcs-user-name="${VCS_USER_NAME}"
