include:
  - local: ".gitlab/jobs/.dagger.yml"

.releaser_release:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk-release"
    SDK_LANGUAGE: "python"
    GIT_STRATEGY: "fetch"
    GIT_DEPTH: "0"
    AUTH_TOKEN: "env:AUTH_TOKEN"
    AUTH_USER_NAME: "x-access-token"
    GIT_USER_EMAIL: "ci@shiryu.dev"
    GIT_USER_NAME: "CI Release Bot"
    PLATFORM: "linux/amd64"
    PROJECT_DIRECTORY: "."
  script:
    - dagger --mod=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} call ${SDK_LANGUAGE} releaser release --auth-token="${AUTH_TOKEN}" --auth-user-name="${AUTH_USER_NAME}" --git-user-email="${GIT_USER_EMAIL}" --git-user-name="${GIT_USER_NAME}" --platform="${PLATFORM}" --project-directory="${PROJECT_DIRECTORY}"
