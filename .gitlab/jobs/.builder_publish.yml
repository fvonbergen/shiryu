include:
  - local: ".gitlab/jobs/.dagger.yml"

.builder_publish:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk-release-add-deploy"
    SDK_LANGUAGE: "python"
    PLATFORM: "linux/amd64"
    REPOSITORY_PASSWORD_: "env:REPOSITORY_PASSWORD"
    REPOSITORY_URL: "${REPOSITORY_URL}"
    REPOSITORY_USER: "${REPOSITORY_USER}"
  script:
    - dagger --load-module=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} call ${SDK_LANGUAGE} builder publish --platform="${PLATFORM}" --repository-password="${REPOSITORY_PASSWORD_}" --repository-url="${REPOSITORY_URL}" --repository-user="${REPOSITORY_USER}"
