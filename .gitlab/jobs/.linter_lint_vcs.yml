include:
  - local: ".gitlab/jobs/.dagger.yml"

.linter_lint_vcs:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/scar"
    SDK_LANGUAGE: "python"
    GIT_STRATEGY: "fetch"
    GIT_DEPTH: "0"
    BRANCH_HISTORY: "True"
    PLATFORM: "linux/amd64"
  script:
    - git fetch origin main:refs/remotes/origin/main || true
    - TARGET_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_BRANCH}"
    - if [ -n "$TARGET_BRANCH" ]; then git checkout -B "$TARGET_BRANCH" "$CI_COMMIT_SHA"; fi
    - dagger --load-module=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} api call ${SDK_LANGUAGE} linter lint-vcs --branch-history="${BRANCH_HISTORY}" --platform="${PLATFORM}"
