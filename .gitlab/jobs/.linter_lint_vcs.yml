include:
  - local: ".gitlab/jobs/.dagger.yml"

.linter_lint_vcs:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk-release-dagger-v1.0.0-beta.16"
    SDK_LANGUAGE: "python"
    GIT_STRATEGY: "fetch"
    GIT_DEPTH: "0"
    BRANCH_HISTORY: "True"
    PLATFORM: "linux/amd64"
  script:
    - git fetch origin main:refs/remotes/origin/main || true
    - dagger --mod=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} call ${SDK_LANGUAGE} linter lint-vcs --branch-history="${BRANCH_HISTORY}" --platform="${PLATFORM}"
