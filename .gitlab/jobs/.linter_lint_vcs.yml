include:
  - local: ".gitlab/jobs/.dagger.yml"

.linter_lint_vcs:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk"
    SDK_LANGUAGE: "python"
    BRANCH_HISTORY: "True"
    PLATFORM: "linux/amd64"
    PROJECT_DIRECTORY: "."
  script:
    - dagger --mod=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} call ${SDK_LANGUAGE} linter lint_vcs --branch-history="${BRANCH_HISTORY}" --platform="${PLATFORM}" --project-directory="${PROJECT_DIRECTORY}"