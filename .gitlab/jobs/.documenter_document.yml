include:
  - local: ".gitlab/jobs/.dagger.yml"

.documenter_document:
  extends: .dagger
  variables:
    SHIRYU_VERSION: "feat/add-python-sdk-release-add-some-new-things-1.0.0-beta.16"
    SDK_LANGUAGE: "python"
    PLATFORM: "linux/amd64"
  script:
    - dagger --mod=gitlab.com/fvonbergen1/shiryu@${SHIRYU_VERSION} call ${SDK_LANGUAGE} documenter document --platform="${PLATFORM}" export --path=./site
    - mkdir public
    - cp --recursive site/* public/
  artifacts:
    paths:
      - public
