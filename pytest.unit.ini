[pytest]
# pytest
python_files = test_*.py
pythonpath = src
testpaths = tests/unit
# pytest-asyncio
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# pytest addopts
addopts =
  # pytest
  -vv
  -ra
  --strict-markers
  --strict-config
# pytest-cov
  --cov
  --cov-report=term
  --cov-report=xml
  --cov-config=.coveragerc
# pytest-xdist
  --numprocesses=auto
  --dist=load
