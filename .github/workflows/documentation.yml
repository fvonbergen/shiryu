# TODO: remove this workflow after feat/add-python-sdk branch merge. It's only used for testing.
# TODO: remove deployment branches: https://github.com/fvonbergen/shiryu/settings/environments/6400911654/edit
name: documentation
on: push

env:
  DO_NOT_TRACK: "1"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  documenter_document:
    name: Documenter document
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: check_out_code
        name: Check out code
        uses: actions/checkout@v7
      - id: documenter_document
        name: Documenter document
        uses: ./.github/actions/documenter_document
        with:
          dagger_cloud_token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          shiryu_version: "feat/add-python-sdk"
          sdk_language: "python"
          platform: "linux/amd64"
          project: "."
      - id: upload_artifact
        name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "site/"
      - id: deploy_to_github_pages
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
