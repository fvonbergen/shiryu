name: release
on:
  workflow_dispatch:

env:
  DO_NOT_TRACK: "1"

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  releaser_release:
    name: Releaser release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: check_out_code
        name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: releaser_release
        name: Releaser release
        uses: "./.github/actions/releaser_release"
        with:
          dagger_cloud_token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          shiryu_version: "feat/add-python-sdk-release"
          sdk_language: "python"
          auth_token: ${{ secrets.AUTH_TOKEN }}
          platform: "linux/amd64"
          project_directory: "."
          vcs_user_email: "ci@shiryu.dev"
          vcs_user_name: "CI Release Bot"
  builder_publish:
    name: Builder publish
    needs: releaser_release
    runs-on: ubuntu-latest
    steps:
      - id: check_out_code
        name: Check out code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: builder_publish
        name: Builder publish
        uses: "./.github/actions/builder_publish"
        with:
          dagger_cloud_token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          shiryu_version: "feat/add-python-sdk-release"
          sdk_language: "python"
          platform: "linux/amd64"
          project_directory: "."
          repository_password: ${{ secrets.REPOSITORY_PASSWORD }}
          repository_url: ${{ secrets.REPOSITORY_URL }}
          repository_user: ${{ secrets.REPOSITORY_USER }}
  documenter_document:
    name: Documenter document
    needs: releaser_release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: check_out_code
        name: Check out code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: documenter_document
        name: Documenter document
        uses: "./.github/actions/documenter_document"
        with:
          dagger_cloud_token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          shiryu_version: "feat/add-python-sdk-release"
          sdk_language: "python"
          platform: "linux/amd64"
          project_directory: "."
      - id: upload_artifact
        name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deploy_to_github_pages
        name: Deploy to GitHub pages
        uses: actions/deploy-pages@v5
