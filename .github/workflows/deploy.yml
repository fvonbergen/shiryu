name: deploy

on:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"

jobs:
  builder_publish:
    name: Builder publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      last_tag: ${{ steps.last_tag.outputs.result }}
    steps:
      - id: last_tag
        name: Get last tag
        uses: actions/github-script@v6
        with:
          script: |
            const tags = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            return tags.data.length ? tags.data[0].name : '';
          result-encoding: string
      - id: check_out_code
        name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.last_tag.outputs.result }}
          fetch-depth: 0
      - id: builder_publish
        name: Builder publish
        uses: "./.github/actions/builder_publish"
        with:
          dagger_cloud_token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          shiryu_version: "feat/add-python-sdk-release"
          sdk_language: "python"
          platform: "linux/amd64"
          repository_password: ${{ secrets.REPOSITORY_PASSWORD }}
          repository_url: ${{ secrets.REPOSITORY_URL }}
          repository_user: ${{ secrets.REPOSITORY_USER }}
  documenter_document:
    name: Documenter document
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: builder_publish
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: check_out_code
        name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.builder_publish.outputs.last_tag }}
          fetch-depth: 0
      - id: documenter_document
        name: Documenter document
        uses: "./.github/actions/documenter_document"
        with:
          dagger_cloud_token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          shiryu_version: "feat/add-python-sdk-release"
          sdk_language: "python"
          platform: "linux/amd64"
      - id: upload_artifact
        name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deploy_to_github_pages
        name: Deploy to GitHub pages
        uses: actions/deploy-pages@v5